  <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="assets/logo.jpg">
  <meta name="theme-color" content="#0b1a33">
  <meta property="og:title" content="TITAN LaB 🏛️">
  <meta property="og:description" content="Exercise science, visualized.">

  <style>
    :root {
      --navy: #0b1a33;
      --ink: #f4f7fb;
      --muted: #a9bdd3;
      --line: rgba(168, 198, 230, 0.22);
      --plate: rgba(255, 255, 255, 0.045);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(ellipse 90% 46% at 50% -8%, rgba(72, 148, 230, 0.38), transparent 58%),
        radial-gradient(ellipse 42% 28% at 50% 16%, rgba(110, 210, 255, 0.14), transparent 70%),
        linear-gradient(180deg, #10284a 0%, var(--navy) 38%, #07111f 100%);
      background-attachment: fixed;
    }

    main {
      width: min(440px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 40px 22px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow:
        0 0 0 1px rgba(150, 205, 255, 0.28),
        0 0 36px rgba(64, 150, 240, 0.42);
    }

    h1 {
      margin: 18px 0 0;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.045em;
      line-height: 1.15;
    }

    .tagline {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.4;
    }

    .actions {
      width: 100%;
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 0 16px 0 18px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), var(--plate));
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
    }

    .link:hover {
      border-color: rgba(150, 205, 255, 0.55);
      background: linear-gradient(180deg, rgba(90, 160, 230, 0.18), rgba(255, 255, 255, 0.05));
    }

    .link:active { transform: scale(0.985); }

    .link:focus-visible {
      outline: 2px solid #8ec8ff;
      outline-offset: 3px;
    }

    .icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .icon svg { width: 24px; height: 24px; display: block; }

    .label { flex: 1; text-align: left; }

    .chevron {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: #8ea6c2;
    }

    .chevron svg { width: 18px; height: 18px; display: block; }

    .plan {
      min-height: 76px;
      padding-top: 14px;
      padding-bottom: 14px;
      color: #06203d;
      background: linear-gradient(180deg, #f3fbff 0%, #8fd4ff 42%, #3aa6ff 100%);
      border-color: rgba(255, 255, 255, 0.72);
      box-shadow:
        0 0 0 1px rgba(190, 230, 255, 0.45),
        0 0 28px rgba(80, 180, 255, 0.62),
        0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .plan .label {
      font-size: 1.02rem;
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    .plan .chevron { color: #06203d; }

    .plan:hover {
      color: #041628;
      border-color: #ffffff;
      background: linear-gradient(180deg, #ffffff 0%, #b6e4ff 40%, #59b6ff 100%);
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      color: #7e93ad;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-align: center;
    }

    @media (min-width: 800px) {
      main { padding-top: 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>
